<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LARP OS</title>
  <!-- Font Awesome for pro icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    body {
      background: #0a0c0e;
      font-family: -apple-system, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
      height: 100vh;
      overflow: hidden;
      color: #eaeef2;
    }
    /* ─── BOOT SCREEN ─── */
    #boot {
      position: fixed;
      inset: 0;
      background: #0a0c0e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.8s ease;
    }
    #boot.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .boot-box {
      background: #14181c;
      border: 1px solid #2a3036;
      border-radius: 20px;
      padding: 2rem 2.5rem;
      min-width: 520px;
      max-width: 640px;
      box-shadow: 0 24px 48px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.02);
    }
    .boot-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: #6a7a84;
      border-bottom: 1px solid #252c32;
      padding-bottom: 0.6rem;
      margin-bottom: 1.2rem;
      letter-spacing: 0.3px;
    }
    .boot-header span:last-child {
      color: #8a9aa4;
    }
    .boot-log {
      font-family: 'Menlo', 'Monaco', 'Fira Code', monospace;
      font-size: 0.85rem;
      line-height: 1.7;
      color: #b6c8d2;
      min-height: 280px;
      max-height: 340px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #2a3036 transparent;
      padding-right: 4px;
    }
    .boot-log::-webkit-scrollbar {
      width: 6px;
    }
    .boot-log::-webkit-scrollbar-track {
      background: transparent;
    }
    .boot-log::-webkit-scrollbar-thumb {
      background: #2a3036;
      border-radius: 8px;
    }
    .log-line {
      display: flex;
      gap: 0.8rem;
      padding: 0 2px;
    }
    .log-line .prefix {
      color: #5f7a8a;
      white-space: pre;
      min-width: 70px;
    }
    .log-line .msg {
      color: #d4e2ed;
    }
    .log-line .ok {
      color: #5bc97a;
    }
    .log-line .fail {
      color: #e4646a;
    }
    .log-line .highlight {
      color: #f5c542;
    }
    .progress-track {
      margin-top: 1.2rem;
      background: #1e262c;
      border-radius: 40px;
      height: 6px;
      width: 100%;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: #5bc97a;
      transition: width 0.15s linear;
      border-radius: 40px;
    }
    .boot-footer {
      margin-top: 1.2rem;
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: #5f7482;
      border-top: 1px solid #1e262c;
      padding-top: 0.8rem;
    }
    .boot-footer .skip {
      background: transparent;
      border: 1px solid #2f3a42;
      color: #a0b4c2;
      padding: 0.2rem 1rem;
      border-radius: 30px;
      font-size: 0.7rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .boot-footer .skip:hover {
      background: #1e262c;
      border-color: #4a5a66;
      color: #d4e2ed;
    }

    /* ─── DESKTOP ─── */
    #desktop {
      width: 100vw;
      height: 100vh;
      background: #1a1e24;
      background-image: radial-gradient(circle at 20% 30%, #2d3a44 0%, #0e1218 90%);
      position: relative;
      display: flex;
      flex-direction: column;
    }
    /* top bar */
    .topbar {
      height: 32px;
      background: rgba(20, 26, 32, 0.72);
      backdrop-filter: blur(22px) saturate(1.2);
      -webkit-backdrop-filter: blur(22px) saturate(1.2);
      border-bottom: 1px solid rgba(255,255,255,0.04);
      display: flex;
      align-items: center;
      padding: 0 16px;
      font-size: 0.75rem;
      color: #d2dee8;
      flex-shrink: 0;
      justify-content: space-between;
    }
    .topbar-left, .topbar-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .topbar-left .logo {
      font-weight: 600;
      letter-spacing: 0.3px;
      background: rgba(255,255,255,0.04);
      padding: 0 12px 0 8px;
      border-radius: 30px;
      line-height: 24px;
      font-size: 0.7rem;
      color: #b2ccdd;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .topbar-left .logo i {
      font-size: 0.9rem;
      color: #8ab4d6;
    }
    .topbar-menu {
      display: flex;
      gap: 12px;
      font-size: 0.7rem;
      color: #b0c6d4;
    }
    .topbar-menu span {
      cursor: default;
      opacity: 0.8;
    }
    .topbar-menu span:hover {
      opacity: 1;
    }
    .topbar-time {
      background: rgba(0,0,0,0.2);
      padding: 0 12px;
      border-radius: 30px;
      line-height: 24px;
      font-size: 0.7rem;
      color: #c8dae6;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .topbar-time i {
      font-size: 0.75rem;
      color: #8aaec9;
    }

    /* desktop area */
    .desktop-area {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    /* ─── WINDOWS ─── */
    .window {
      position: absolute;
      background: #1e262e;
      border-radius: 14px;
      border: 1px solid #2f3a44;
      box-shadow: 0 12px 40px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.02);
      min-width: 280px;
      min-height: 160px;
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(4px);
      transition: box-shadow 0.15s, border-color 0.15s;
    }
    .window.active {
      box-shadow: 0 16px 48px rgba(0,0,0,0.8), 0 0 0 1px rgba(100,180,255,0.08);
      border-color: #3d5265;
    }
    .window-header {
      height: 38px;
      background: rgba(30, 38, 46, 0.8);
      border-radius: 14px 14px 0 0;
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 10px;
      flex-shrink: 0;
      cursor: grab;
      border-bottom: 1px solid #29333c;
    }
    .window-header:active {
      cursor: grabbing;
    }
    .window-controls {
      display: flex;
      gap: 7px;
      margin-right: 6px;
    }
    .window-controls span {
      display: inline-block;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      transition: 0.1s;
      cursor: pointer;
    }
    .win-close { background: #ed6a5e; }
    .win-min { background: #f5bd4f; }
    .win-max { background: #61c354; }
    .window-title {
      flex: 1;
      font-size: 0.75rem;
      color: #b8ccdb;
      letter-spacing: 0.2px;
      font-weight: 500;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .window-title i {
      color: #8ab4d6;
      font-size: 0.85rem;
    }
    .window-body {
      flex: 1;
      padding: 14px;
      overflow: auto;
      color: #c8dae6;
      font-size: 0.8rem;
      background: #131a20;
      border-radius: 0 0 14px 14px;
    }
    .window-body.placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #4a5f6e;
      font-style: italic;
      flex-direction: column;
      gap: 8px;
    }
    .window-body.placeholder i {
      font-size: 2rem;
      color: #3a4f5e;
    }

    /* ─── DOCK ─── */
    .dock {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(24, 32, 40, 0.72);
      backdrop-filter: blur(24px) saturate(1.3);
      -webkit-backdrop-filter: blur(24px) saturate(1.3);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 40px;
      padding: 6px 16px;
      display: flex;
      gap: 4px;
      align-items: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.7);
      z-index: 100;
    }
    .dock-item {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      background: rgba(255,255,255,0.03);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      transition: 0.15s;
      cursor: pointer;
      color: #c0d6e6;
      border: 1px solid transparent;
    }
    .dock-item i {
      font-size: 1.3rem;
      color: #b8d0e2;
    }
    .dock-item:hover {
      background: rgba(255,255,255,0.08);
      transform: scale(1.05);
    }
    .dock-item.active {
      background: rgba(100, 180, 255, 0.1);
      border-color: rgba(100, 180, 255, 0.15);
    }
    .dock-divider {
      width: 1px;
      height: 32px;
      background: rgba(255,255,255,0.08);
      margin: 0 4px;
    }

    /* ─── CONTEXT MENU ─── */
    .ctx-menu {
      position: fixed;
      background: #1a222a;
      border: 1px solid #2e3a44;
      border-radius: 12px;
      padding: 6px 4px;
      min-width: 200px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.8);
      backdrop-filter: blur(12px);
      z-index: 999;
      display: none;
    }
    .ctx-menu.visible {
      display: block;
    }
    .ctx-item {
      padding: 6px 18px;
      font-size: 0.75rem;
      color: #c8dae6;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.05s;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .ctx-item i {
      width: 18px;
      color: #6a8a9e;
      font-size: 0.8rem;
    }
    .ctx-item:hover {
      background: #2c3b48;
    }
    .ctx-item.danger {
      color: #e67a7a;
    }
    .ctx-item.danger i {
      color: #e67a7a;
    }
    .ctx-sep {
      height: 1px;
      background: #2a343e;
      margin: 4px 12px;
    }

    .hidden { display: none; }

    /* small tweaks */
    .fa-fw { width: 1.1rem; }
  </style>
</head>
<body>

<!-- BOOT SEQUENCE -->
<div id="boot">
  <div class="boot-box">
    <div class="boot-header">
      <span><i class="fas fa-microchip"></i> LARP BIOS v6.66</span>
      <span><i class="fas fa-lock"></i> secure boot: disabled</span>
    </div>
    <div class="boot-log" id="bootLog"></div>
    <div class="progress-track">
      <div class="progress-fill" id="bootProgress" style="width:0%"></div>
    </div>
    <div class="boot-footer">
      <span><i class="fas fa-power-off"></i>  LARP OS  ·  probably legal</span>
      <button class="skip" id="skipBoot"><i class="fas fa-forward"></i> skip</button>
    </div>
  </div>
</div>

<!-- DESKTOP -->
<div id="desktop" class="hidden">
  <!-- Top Bar -->
  <div class="topbar">
    <div class="topbar-left">
      <span class="logo"><i class="fas fa-apple-alt"></i> LARP</span>
      <div class="topbar-menu">
        <span>Finder</span>
        <span>File</span>
        <span>Edit</span>
        <span>View</span>
        <span>Go</span>
        <span>Window</span>
        <span>Help</span>
      </div>
    </div>
    <div class="topbar-right">
      <i class="fas fa-wifi" style="opacity:0.6;"></i>
      <i class="fas fa-volume-up" style="opacity:0.6;"></i>
      <i class="fas fa-battery-three-quarters" style="opacity:0.6;"></i>
      <span class="topbar-time" id="topTime">
        <i class="far fa-clock"></i> <span id="clockDisplay">--:--</span>
      </span>
    </div>
  </div>

  <!-- Desktop Area -->
  <div class="desktop-area" id="desktopArea"></div>

  <!-- Dock -->
  <div class="dock" id="dock">
    <div class="dock-item" data-app="launcher" title="Launchpad"><i class="fas fa-th"></i></div>
    <div class="dock-item active" data-app="finder" title="Finder"><i class="fas fa-folder"></i></div>
    <div class="dock-item" data-app="terminal" title="Terminal"><i class="fas fa-terminal"></i></div>
    <div class="dock-divider"></div>
    <div class="dock-item" data-app="browser" title="LARP Browser"><i class="fas fa-compass"></i></div>
    <div class="dock-item" data-app="notes" title="DeadDrop Notes"><i class="fas fa-sticky-note"></i></div>
    <div class="dock-item" data-app="music" title="LARP Music"><i class="fas fa-music"></i></div>
    <div class="dock-divider"></div>
    <div class="dock-item" data-app="settings" title="Settings"><i class="fas fa-sliders-h"></i></div>
  </div>

  <!-- Context Menu -->
  <div class="ctx-menu" id="ctxMenu">
    <div class="ctx-item"><i class="fas fa-folder-plus"></i> New Folder</div>
    <div class="ctx-item"><i class="fas fa-file-alt"></i> New Text</div>
    <div class="ctx-sep"></div>
    <div class="ctx-item"><i class="fas fa-image"></i> Change Wallpaper</div>
    <div class="ctx-item"><i class="fas fa-eye"></i> Show View Options</div>
    <div class="ctx-sep"></div>
    <div class="ctx-item danger"><i class="fas fa-power-off"></i> Force Quit…</div>
  </div>
</div>

<script>
  (function() {
    'use strict';

    // ─── BOOT ────────────────────────────────────────────────
    const bootEl = document.getElementById('boot');
    const desktopEl = document.getElementById('desktop');
    const logEl = document.getElementById('bootLog');
    const progressEl = document.getElementById('bootProgress');
    const skipBtn = document.getElementById('skipBoot');

    let bootFinished = false;
    let bootTimer = null;

    const bootLines = [
      { prefix: '[BIOS]', msg: 'Initializing questionable hardware...', ok: true },
      { prefix: '[BIOS]', msg: 'Loading suspicious kernel modules...', ok: true },
      { prefix: '[KERNEL]', msg: 'Mounting common sense...', ok: false },
      { prefix: '[KERNEL]', msg: 'Starting packet engine...', ok: true },
      { prefix: '[NET]', msg: 'Connecting to ASAN...', ok: true },
      { prefix: '[ASAN]', msg: 'CONNECTION TERMINATED — Reason: They noticed.', ok: false, highlight: true },
      { prefix: '[KERNEL]', msg: 'LARP Kernel loading...', ok: true },
    ];

    let lineIndex = 0;
    let progress = 0;
    let bootComplete = false;

    function appendBootLine(line) {
      const div = document.createElement('div');
      div.className = 'log-line';
      const prefixSpan = document.createElement('span');
      prefixSpan.className = 'prefix';
      prefixSpan.textContent = line.prefix;
      const msgSpan = document.createElement('span');
      msgSpan.className = 'msg';
      if (line.ok === true) {
        msgSpan.innerHTML = `<span class="ok"><i class="fas fa-check-circle"></i> [ OK ]</span>  ${line.msg}`;
      } else if (line.ok === false && line.highlight) {
        msgSpan.innerHTML = `<span class="fail"><i class="fas fa-times-circle"></i> [FAIL]</span>  <span class="highlight">${line.msg}</span>`;
      } else if (line.ok === false) {
        msgSpan.innerHTML = `<span class="fail"><i class="fas fa-times-circle"></i> [FAIL]</span>  ${line.msg}`;
      } else {
        msgSpan.textContent = line.msg;
      }
      div.appendChild(prefixSpan);
      div.appendChild(msgSpan);
      logEl.appendChild(div);
      logEl.scrollTop = logEl.scrollHeight;
    }

    function advanceBoot() {
      if (bootComplete) return;
      if (lineIndex < bootLines.length) {
        const line = bootLines[lineIndex];
        appendBootLine(line);
        lineIndex++;
        progress = Math.min(95, (lineIndex / bootLines.length) * 100);
        progressEl.style.width = progress + '%';
        if (lineIndex === bootLines.length) {
          setTimeout(() => {
            progressEl.style.width = '100%';
            bootComplete = true;
            setTimeout(finishBoot, 500);
          }, 400);
        } else {
          const delay = 180 + Math.floor(Math.random() * 280);
          bootTimer = setTimeout(advanceBoot, delay);
        }
      }
    }

    function finishBoot() {
      if (bootFinished) return;
      bootFinished = true;
      bootEl.classList.add('hidden');
      desktopEl.classList.remove('hidden');
      updateClock();
      setInterval(updateClock, 1000);
      createSampleWindows();
    }

    skipBtn.addEventListener('click', function() {
      if (bootTimer) clearTimeout(bootTimer);
      while (lineIndex < bootLines.length) {
        appendBootLine(bootLines[lineIndex]);
        lineIndex++;
      }
      progressEl.style.width = '100%';
      bootComplete = true;
      setTimeout(finishBoot, 200);
    });

    setTimeout(advanceBoot, 350);

    // ─── DESKTOP ─────────────────────────────────────────────
    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('clockDisplay').textContent = h + ':' + m;
    }

    const desktopArea = document.getElementById('desktopArea');
    let windows = [];
    let windowZIndex = 10;

    function createWindow(title, icon, x, y, w, h, content) {
      const win = document.createElement('div');
      win.className = 'window active';
      win.style.left = x + 'px';
      win.style.top = y + 'px';
      win.style.width = w + 'px';
      win.style.height = h + 'px';
      win.style.zIndex = windowZIndex++;

      const header = document.createElement('div');
      header.className = 'window-header';
      const controls = document.createElement('div');
      controls.className = 'window-controls';
      controls.innerHTML = `<span class="win-close"></span><span class="win-min"></span><span class="win-max"></span>`;
      const titleSpan = document.createElement('span');
      titleSpan.className = 'window-title';
      titleSpan.innerHTML = `<i class="${icon}"></i> ${title}`;
      header.appendChild(controls);
      header.appendChild(titleSpan);

      const body = document.createElement('div');
      body.className = 'window-body placeholder';
      if (content) {
        body.innerHTML = content;
      } else {
        body.innerHTML = `<i class="${icon}"></i><span>${title} (placeholder)</span>`;
      }

      win.appendChild(header);
      win.appendChild(body);
      desktopArea.appendChild(win);

      const winData = { el: win, title };
      windows.push(winData);

      makeDraggable(win, header);

      const closeBtn = controls.querySelector('.win-close');
      const minBtn = controls.querySelector('.win-min');
      const maxBtn = controls.querySelector('.win-max');

      closeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        win.remove();
        windows = windows.filter(w => w.el !== win);
      });
      minBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        win.style.display = win.style.display === 'none' ? 'flex' : 'none';
      });
      maxBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (win.dataset.maximized === 'true') {
          win.style.width = win.dataset.prevWidth || w + 'px';
          win.style.height = win.dataset.prevHeight || h + 'px';
          win.style.left = win.dataset.prevLeft || x + 'px';
          win.style.top = win.dataset.prevTop || y + 'px';
          win.dataset.maximized = 'false';
        } else {
          win.dataset.prevWidth = win.style.width;
          win.dataset.prevHeight = win.style.height;
          win.dataset.prevLeft = win.style.left;
          win.dataset.prevTop = win.style.top;
          win.style.left = '0px';
          win.style.top = '32px';
          win.style.width = '100%';
          win.style.height = 'calc(100% - 32px)';
          win.dataset.maximized = 'true';
        }
      });

      win.addEventListener('mousedown', () => {
        windows.forEach(w => w.el.classList.remove('active'));
        win.classList.add('active');
        win.style.zIndex = windowZIndex++;
      });

      return win;
    }

    function makeDraggable(win, handle) {
      let offsetX, offsetY, dragging = false;
      handle.addEventListener('mousedown', (e) => {
        if (e.target.closest('.window-controls')) return;
        const rect = win.getBoundingClientRect();
        offsetX = e.clientX - rect.left;
        offsetY = e.clientY - rect.top;
        dragging = true;
        win.style.cursor = 'grabbing';
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
        e.preventDefault();
      });
      function onMove(e) {
        if (!dragging) return;
        const parentRect = desktopArea.getBoundingClientRect();
        let left = e.clientX - parentRect.left - offsetX;
        let top = e.clientY - parentRect.top - offsetY;
        left = Math.max(0, Math.min(left, parentRect.width - win.offsetWidth));
        top = Math.max(0, Math.min(top, parentRect.height - win.offsetHeight));
        win.style.left = left + 'px';
        win.style.top = top + 'px';
      }
      function onUp() {
        dragging = false;
        win.style.cursor = '';
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
      }
    }

    function createSampleWindows() {
      createWindow('Finder', 'fas fa-folder', 60, 50, 480, 300,
        '<i class="fas fa-folder-open" style="font-size:2.4rem;color:#6a8a9e;"></i><span style="margin-top:6px;">~/LARP</span>'
      );
      createWindow('Terminal', 'fas fa-terminal', 320, 110, 460, 280,
        '<i class="fas fa-terminal" style="font-size:2rem;color:#5bc97a;"></i><span style="margin-top:6px;">zsh — larp@larp-os</span>'
      );
    }

    // ─── CONTEXT MENU ────────────────────────────────────────
    const ctxMenu = document.getElementById('ctxMenu');
    desktopArea.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      ctxMenu.classList.add('visible');
      ctxMenu.style.left = Math.min(e.clientX, window.innerWidth - 220) + 'px';
      ctxMenu.style.top = Math.min(e.clientY, window.innerHeight - 180) + 'px';
    });
    document.addEventListener('click', () => {
      ctxMenu.classList.remove('visible');
    });

    // ─── DOCK ────────────────────────────────────────────────
    document.querySelectorAll('.dock-item').forEach(item => {
      item.addEventListener('click', function() {
        const app = this.dataset.app;
        let title, icon, x, y, w, h, content;
        const baseX = 100 + Math.floor(Math.random() * 80);
        const baseY = 80 + Math.floor(Math.random() * 60);
        switch(app) {
          case 'launcher':
            title = 'Launchpad'; icon = 'fas fa-th'; x=baseX+20; y=baseY; w=420; h=320;
            content = '<i class="fas fa-th" style="font-size:2.2rem;color:#6a8a9e;"></i><span style="margin-top:6px;">LARP Launchpad</span>';
            break;
          case 'finder':
            title = 'Finder'; icon = 'fas fa-folder'; x=baseX; y=baseY; w=480; h=320;
            content = '<i class="fas fa-folder-open" style="font-size:2.4rem;color:#6a8a9e;"></i><span style="margin-top:6px;">~/LARP</span>';
            break;
          case 'terminal':
            title = 'Terminal'; icon = 'fas fa-terminal'; x=baseX+40; y=baseY+20; w=460; h=290;
            content = '<i class="fas fa-terminal" style="font-size:2rem;color:#5bc97a;"></i><span style="margin-top:6px;">zsh — larp@larp-os</span>';
            break;
          case 'browser':
            title = 'LARP Browser'; icon = 'fas fa-compass'; x=baseX+10; y=baseY-10; w=520; h=340;
            content = '<i class="fas fa-compass" style="font-size:2.2rem;color:#7aaedb;"></i><span style="margin-top:6px;">LARP Browser</span>';
            break;
          case 'notes':
            title = 'DeadDrop Notes'; icon = 'fas fa-sticky-note'; x=baseX+30; y=baseY+10; w=400; h=300;
            content = '<i class="fas fa-sticky-note" style="font-size:2.2rem;color:#f5c542;"></i><span style="margin-top:6px;">DeadDrop Notes</span>';
            break;
          case 'music':
            title = 'LARP Music'; icon = 'fas fa-music'; x=baseX-10; y=baseY+20; w=440; h=310;
            content = '<i class="fas fa-music" style="font-size:2.2rem;color:#b47ae8;"></i><span style="margin-top:6px;">LARP Music</span>';
            break;
          case 'settings':
            title = 'Settings'; icon = 'fas fa-sliders-h'; x=baseX+40; y=baseY+10; w=420; h=340;
            content = '<i class="fas fa-sliders-h" style="font-size:2.2rem;color:#8ab4d6;"></i><span style="margin-top:6px;">LARP Control Center</span>';
            break;
          default:
            title = app; icon = 'fas fa-cube'; x=baseX; y=baseY; w=360; h=260;
            content = `<i class="fas fa-cube" style="font-size:2rem;color:#6a8a9e;"></i><span style="margin-top:6px;">${app}</span>`;
        }
        createWindow(title, icon, x, y, w, h, content);
      });
    });

    // expose for testing
    window.__larp = { windows, desktopArea, createWindow };

  })();
</script>
